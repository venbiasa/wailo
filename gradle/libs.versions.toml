[versions]
# Toolchain pinned to match the target consumer app so the SDK/plugin are consumable there
# (Kotlin 2.2.21 ↔ Gradle 7.6.3–8.14 ↔ AGP 7.3.1–8.11.1). See DECISIONS.md.
kotlin = "2.2.21"
agp = "8.10.1"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
composeMultiplatform = "1.11.0"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.10.0"
coroutines = "1.10.2"
# Ktor 3.3.x is the last line built on Kotlin 2.2; 3.4+ moved to Kotlin 2.3, whose Kotlin/Native klibs
# can't be consumed by our Kotlin/Native 2.2.21 target (sample-kmp iOS). See ADR-0014.
ktor = "3.3.3"
wire = "5.3.5"
okhttp = "4.12.0"
asm = "9.9"
junit = "4.13.2"
# QR scanning for the debug-only panel. Never reaches :sdk-android, which ships in third-party apps.
zxing = "4.3.0"

[libraries]
agp-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
# iOS engine for the KMP sample; sits on URLSession so sdk-ios's swizzle captures it.
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }

zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing" }

wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
# CLI compiler used to emit Swift for sdk-ios; the Wire Gradle plugin has no Swift target.
wire-compiler = { module = "com.squareup.wire:wire-compiler", version.ref = "wire" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
wire = { id = "com.squareup.wire", version.ref = "wire" }

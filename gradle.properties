org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-download=false

kotlin.code.style=official

# Single source for the published Maven coordinates. Gradle applies these `group`/`version` keys to
# every project in this build; the standalone wailo-gradle-plugin build reads this same file so its
# coordinates never drift. SNAPSHOT so re-publishing to Maven Local is picked up without a bump.
group=com.venbiasa.wailo
version=0.1.0-SNAPSHOT

android.useAndroidX=true
android.nonTransitiveRClass=true

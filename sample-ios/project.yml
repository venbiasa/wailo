# XcodeGen spec (source of truth; the .xcodeproj and the generated Info.plist are gitignored).
# Regenerate with: cd sample-ios && xcodegen generate
name: WailoSampleiOS
options:
  bundleIdPrefix: com.venbiasa.wailo
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
packages:
  WailoSDK:
    path: ../sdk-ios
targets:
  WailoSampleiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      # The debug superset: WailoSDK plus the on-device settings panel (ADR-0035) — two-finger
      # long-press the bottom half (Option-press in the Simulator) to re-point at another desktop
      # without a rebuild. A shipping app links plain `WailoSDK` for release and this only for debug.
      - package: WailoSDK
        product: WailoSDKDebug
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # A physical device reaches the desktop across the LAN, which iOS 14+ gates behind user consent.
        # Bonjour browsing is denied outright unless the service type is declared here too.
        NSLocalNetworkUsageDescription: Wailo finds the Wailo desktop app on your network and streams this app's HTTP traffic to it.
        NSBonjourServices:
          - _wailo._tcp
        # Only for scanning Studio's pairing QR (ADR-0039). Optional: the panel checks for this key
        # before touching AVFoundation and falls back to the typed code without it — asking for camera
        # access with no usage description terminates the app, which is not something an SDK may do to
        # its host. The typed code needs nothing here.
        NSCameraUsageDescription: Wailo scans the pairing code shown by the Wailo desktop app, so this device can prove which desktop it is talking to over Wi-Fi.
        # The transport is plaintext ws:// to a LAN IP. ATS exempted IP literals until iOS 17, which now
        # requires them listed explicitly; NSAllowsLocalNetworking covers the pre-17 behaviour. The three
        # entries are the RFC 1918 private ranges, so any home/office subnet is covered.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "192.168.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
            "10.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "172.16.0.0/12":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.venbiasa.wailo.sampleios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Simulator builds don't need signing; keeps CI/compile-only runs unsigned.
        CODE_SIGNING_ALLOWED: NO

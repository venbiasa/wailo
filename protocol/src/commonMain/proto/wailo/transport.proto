syntax = "proto3";

package com.venbiasa.wailo.protocol;

import "wailo/capture.proto";

// One Envelope per WebSocket frame. Device -> desktop: the client opens with a Hello, then streams
// exchanges and acknowledgements, requests matched Map Local bodies and Script transforms, and reports
// breakpoint hits. Desktop -> device: pushes rule snapshots and replies to each request or hit. The
// receiver keys on which oneof field is set; new kinds are a oneof extension (ADR-0008), so this stays
// backward-compatible.
//
// Over WiFi the exchange above is preceded by the identity-first v3 handshake (ADR-0060) and every
// frame after it is wrapped in a SealedFrame. Loopback sessions — Simulator, `adb reverse`, the
// usbmux tunnel — skip both and start at Hello as before. The v2 tags remain reserved so they can
// never be reinterpreted as another message, but v3 peers do not expose or admit those message types.
message Envelope {
  // V2 auth occupied these tags. Reserve them permanently so a v3 decoder treats an old opening
  // frame as unknown and the admission state machine rejects it without preserving a fallback API.
  reserved 13 to 16;

  oneof message {
    Hello hello = 1;
    HttpExchange exchange = 2;
    RuleSet rule_set = 3;
    RuleAck rule_ack = 4;
    BodyRequest body_request = 5;
    BodyResponse body_response = 6;
    CaptureFilter capture_filter = 7;
    CaptureFilterAck capture_filter_ack = 8;
    BreakpointRules breakpoint_rules = 9;
    BreakpointRulesAck breakpoint_rules_ack = 10;
    BreakpointHit breakpoint_hit = 11;
    BreakpointDecision breakpoint_decision = 12;
    // Not `sealed`: that is a Kotlin modifier, and Wire escapes it to `sealed_` on that side only,
    // leaving the two generated APIs spelling the same field differently.
    SealedFrame sealed_frame = 17;
    AuthClientHelloV3 auth_client_hello_v3 = 18;
    AuthStudioHelloV3 auth_studio_hello_v3 = 19;
    AuthDeviceProofV3 auth_device_proof_v3 = 20;
    AuthResultV3 auth_result_v3 = 21;
    RevokeDevice revoke_device = 22;
    RevokeDeviceAck revoke_device_ack = 23;
    ScriptRuleSet script_rule_set = 24;
    ScriptRuleSetAck script_rule_set_ack = 25;
    ScriptTransformRequest script_transform_request = 26;
    ScriptTransformResult script_transform_result = 27;
  }
}

message Hello {
  string device_name = 1;
  string app_id = 2;
  string platform = 3;
}

// V3 opens anonymously. In particular there is no install-wide device identifier here: Studio has
// to sign and reveal its own identity before the device chooses a relationship to present.
message AuthClientHelloV3 {
  uint32 version = 1;
  bytes nonce = 2;
  bytes ephemeral_key = 3;
}

// Studio's signed identity and current enrollment policy. The signature covers this policy as well
// as both nonces and both ephemeral keys, so none can be substituted or downgraded in transit.
message AuthStudioHelloV3 {
  bytes nonce = 1;
  bytes public_key = 2;
  bytes ephemeral_key = 3;
  bytes signature = 4;
  bool pairing_required = 5;
}

enum AuthModeV3 {
  AUTH_MODE_V3_UNSPECIFIED = 0;
  AUTH_MODE_V3_KNOWN = 1;
  AUTH_MODE_V3_TOFU = 2;
  AUTH_MODE_V3_INVITED_QR = 3;
  AUTH_MODE_V3_INVITED_CODE = 4;
}

// Sent only after AuthStudioHelloV3's signature and expected identity have been verified. The alias
// is random per Studio relationship; it cannot correlate this app across different Studios.
message AuthDeviceProofV3 {
  string device_alias = 1;
  AuthModeV3 mode = 2;
  uint64 session_counter = 3;
  bytes proof = 4;
}

enum AuthResultCodeV3 {
  AUTH_RESULT_CODE_V3_UNSPECIFIED = 0;
  AUTH_RESULT_CODE_V3_OK = 1;
  AUTH_RESULT_CODE_V3_PAIRING_REQUIRED = 2;
  AUTH_RESULT_CODE_V3_PAIRING_OFFER_INVALID = 3;
  AUTH_RESULT_CODE_V3_UNKNOWN_DEVICE = 4;
}

// The signature authenticates every outcome, including one for which Studio does not possess the
// claimed device key. A successful result also carries an HMAC under the selected long-term key,
// which confirms both ends chose the same relationship before either releases Hello or control data.
message AuthResultV3 {
  AuthResultCodeV3 code = 1;
  bytes proof = 2;
  bytes signature = 3;
}

// These controls are valid only inside SealedFrame. Revocation is best-effort cleanup: local Forget
// does not retain a key merely because an offline Studio could not acknowledge it.
message RevokeDevice {
  string request_id = 1;
}

message RevokeDeviceAck {
  string request_id = 1;
}

// Every frame after a successful WiFi handshake. seq is the AES-GCM nonce counter, unique per
// direction and per session, and must arrive strictly increasing — a repeat is a replay and a gap
// means something other than TCP is delivering these frames.
message SealedFrame {
  uint64 seq = 1;
  bytes ciphertext = 2;
}

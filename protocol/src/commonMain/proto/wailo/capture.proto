syntax = "proto3";

package com.venbiasa.wailo.protocol;

// Captured traffic (device -> desktop) plus the Map Local rule messages the desktop pushes back.

message HttpExchange {
  string id = 1;
  int64 started_at_epoch_ms = 2;
  int64 duration_ms = 3;
  HttpRequest request = 4;
  HttpResponse response = 5;
  // Set only on failure before any response (not for HTTP error statuses).
  string error = 6;
  // True when a Map Local (or future rewrite) rule produced this response instead of the network.
  bool edited = 7;
  // True when the device captured metadata only and omitted the request/response bodies because the
  // host is not on the CaptureAllowlist. Lets the desktop show "unlock to capture" rather than "no
  // body". The bodies are gated together (per host), so one flag covers the whole exchange.
  bool bodies_omitted = 8;
}

message HttpRequest {
  string method = 1;
  string url = 2;
  repeated Header headers = 3;
  bytes body = 4;
  // Declared length; -1 if unknown.
  int64 body_size = 5;
  bool body_truncated = 6;
}

message HttpResponse {
  int32 code = 1;
  string message = 2;
  repeated Header headers = 3;
  bytes body = 4;
  int64 body_size = 5;
  bool body_truncated = 6;
}

message Header {
  string name = 1;
  string value = 2;
}

// --- Map Local (desktop <-> device control channel) ---

// The active Map Local rules, as match-metadata only — no response bodies (ADR-0019). Sent as a
// snapshot: each push replaces the device's set entirely (idempotent), so there is no add/remove
// delta. [epoch] is a monotonic version the desktop owns; the device echoes it in a RuleAck so the
// desktop can detect a lost push and re-push (anti-entropy). The device applies every snapshot it
// receives regardless of epoch — epoch is only for ack-matching/retry — so a desktop restart that
// resets the counter is harmless.
message RuleSet {
  repeated MapLocalRule rules = 1;
  uint64 epoch = 2;
}

// How to *match* a request. Deliberately carries no response body: the device caches only this
// metadata and fetches the body lazily on a match (BodyRequest/BodyResponse), so large fixtures
// never sit resident in the app's memory (ADR-0019).
message MapLocalRule {
  string id = 1;
  bool enabled = 2;
  // Wildcard match against the full request URL; `*` matches any run of characters.
  string url_pattern = 3;
  // HTTP methods this rule applies to; empty means any method.
  repeated string methods = 4;
}

// device -> desktop: confirms the device applied the snapshot at [epoch]. Lets the desktop track how
// far each connection is synced and re-push if a snapshot was silently lost.
message RuleAck {
  uint64 epoch = 1;
}

// Which hosts have their request/response BODIES captured. Metadata (method, url, status, headers,
// sizes) is always captured; only body bytes are gated by this list, so memory is bounded to the few
// hosts the user has "unlocked". Pushed desktop -> device like RuleSet: a full snapshot each time,
// versioned by [epoch] with a CaptureAllowlistAck so a lost push self-repairs (anti-entropy). An
// empty list means capture no bodies (the default until a host is unlocked).
message CaptureAllowlist {
  // Wildcard match against the request host (not the full URL); `*` matches any run of characters.
  repeated string host_patterns = 1;
  uint64 epoch = 2;
}

// device -> desktop: confirms the device applied the allowlist at [epoch], mirroring RuleAck.
message CaptureAllowlistAck {
  uint64 epoch = 1;
}

// device -> desktop: a matched request asking the authority for the response to serve. [correlation_id]
// pairs it with the BodyResponse; [rule_id] is the matched rule; [url]/[method] are passed for logging
// and future per-request logic.
message BodyRequest {
  string correlation_id = 1;
  string rule_id = 2;
  string url = 3;
  string method = 4;
}

// desktop -> device: the response for a BodyRequest, read fresh from the file. [found] is false when
// the rule is gone/disabled or the file can't be read; the device then falls open to the real network.
message BodyResponse {
  string correlation_id = 1;
  bool found = 2;
  int32 code = 3;
  repeated Header headers = 4;
  bytes body = 5;
}

syntax = "proto3";

package com.venbiasa.wailo.protocol;

// Captured traffic (device -> desktop) plus the Map Local rule messages the desktop pushes back.

message HttpExchange {
  string id = 1;
  int64 started_at_epoch_ms = 2;
  int64 duration_ms = 3;
  HttpRequest request = 4;
  HttpResponse response = 5;
  // Set only on failure before any response (not for HTTP error statuses).
  string error = 6;
  // True when a Map Local (or future rewrite) rule produced this response instead of the network.
  bool edited = 7;
  // 8 was bodies_omitted, from the per-host body-gating model. The CaptureFilter now decides whether the
  // whole exchange is captured at all (ADR-0029), so an exchange is always captured in full — there is no
  // partial/metadata-only capture and thus no per-exchange flag. Reserved so the tag is never reused.
  reserved 8;
}

message HttpRequest {
  string method = 1;
  string url = 2;
  repeated Header headers = 3;
  bytes body = 4;
  // Declared length; -1 if unknown.
  int64 body_size = 5;
  bool body_truncated = 6;
}

message HttpResponse {
  int32 code = 1;
  string message = 2;
  repeated Header headers = 3;
  bytes body = 4;
  int64 body_size = 5;
  bool body_truncated = 6;
}

message Header {
  string name = 1;
  string value = 2;
}

// --- Map Local (desktop <-> device control channel) ---

// The active Map Local rules, as match-metadata only — no response bodies (ADR-0019). Sent as a
// snapshot: each push replaces the device's set entirely (idempotent), so there is no add/remove
// delta. [epoch] is a monotonic version the desktop owns; the device echoes it in a RuleAck so the
// desktop can detect a lost push and re-push (anti-entropy). The device applies every snapshot it
// receives regardless of epoch — epoch is only for ack-matching/retry — so a desktop restart that
// resets the counter is harmless.
message RuleSet {
  repeated MapLocalRule rules = 1;
  uint64 epoch = 2;
}

// How to *match* a request. Deliberately carries no response body: the device caches only this
// metadata and fetches the body lazily on a match (BodyRequest/BodyResponse), so large fixtures
// never sit resident in the app's memory (ADR-0019).
message MapLocalRule {
  string id = 1;
  bool enabled = 2;
  // Wildcard match against the full request URL; `*` matches any run of characters.
  string url_pattern = 3;
  // HTTP methods this rule applies to; empty means any method.
  repeated string methods = 4;
}

// device -> desktop: confirms the device applied the snapshot at [epoch]. Lets the desktop track how
// far each connection is synced and re-push if a snapshot was silently lost.
message RuleAck {
  uint64 epoch = 1;
}

// Which hosts a device captures and streams to the desktop (ADR-0029). Two independent lists the desktop
// pushes as one snapshot: with [allowlist_enabled] a host is captured only if it matches one of
// [allow_patterns]; with [blocklist_enabled] a host that matches one of [block_patterns] is never
// captured; with both on a host must match the allowlist AND not the blocklist. With both off (the
// default) every host is captured. The gate is whole-exchange: a matching exchange is captured in full
// and a filtered one is dropped at the source — bodies are never partially omitted. Pushed desktop ->
// device like RuleSet: a full snapshot each time, versioned by [epoch] with a CaptureFilterAck so a lost
// push self-repairs (anti-entropy). Patterns match the request host (not the full URL); `*` matches any
// run of characters. An enabled list with no patterns is inert (matches nothing), so it can't silently
// drop or admit everything.
message CaptureFilter {
  bool allowlist_enabled = 1;
  repeated string allow_patterns = 2;
  bool blocklist_enabled = 3;
  repeated string block_patterns = 4;
  uint64 epoch = 5;
}

// device -> desktop: confirms the device applied the capture filter at [epoch], mirroring RuleAck.
message CaptureFilterAck {
  uint64 epoch = 1;
}

// device -> desktop: a matched request asking the authority for the response to serve. [correlation_id]
// pairs it with the BodyResponse; [rule_id] is the matched rule; [url]/[method] are passed for logging
// and future per-request logic.
message BodyRequest {
  string correlation_id = 1;
  string rule_id = 2;
  string url = 3;
  string method = 4;
}

// desktop -> device: the response for a BodyRequest, read fresh from the file. [found] is false when
// the rule is gone/disabled or the file can't be read; the device then falls open to the real network.
message BodyResponse {
  string correlation_id = 1;
  bool found = 2;
  int32 code = 3;
  repeated Header headers = 4;
  bytes body = 5;
  // Fixed latency applied by the device after the fixture arrives, before the app receives it.
  int32 delay_ms = 6;
}

// --- Scripts (desktop <-> device control channel) ---

// Ordered Script match metadata. Source stays on the daemon; a device uses the derived hook flags to
// avoid a transform round trip when no enabled rule can run for that request and phase.
message ScriptRuleSet {
  repeated ScriptRule rules = 1;
  uint64 epoch = 2;
}

message ScriptRule {
  string id = 1;
  bool enabled = 2;
  string url_pattern = 3;
  repeated string methods = 4;
  bool on_request = 5;
  bool on_response = 6;
}

message ScriptRuleSetAck {
  uint64 epoch = 1;
}

enum ScriptPhase {
  SCRIPT_PHASE_UNSPECIFIED = 0;
  SCRIPT_PHASE_REQUEST = 1;
  SCRIPT_PHASE_RESPONSE = 2;
}

// A device asks the daemon to run every matching hook for one phase. An unreplayable request carries
// its metadata but not replaceable bytes; the result can still change method, URL, and headers.
message ScriptTransformRequest {
  string correlation_id = 1;
  ScriptPhase phase = 2;
  HttpRequest request = 3;
  HttpResponse response = 4;
  bool request_body_replayable = 5;
}

// The last transactionally committed phase value. Body replacement is explicit so a device can keep
// an unavailable request stream byte-for-byte when only metadata changed.
message ScriptTransformResult {
  string correlation_id = 1;
  HttpRequest request = 2;
  HttpResponse response = 3;
  bool request_body_replaced = 4;
  bool response_body_replaced = 5;
  int32 delay_ms = 6;
}

// --- Breakpoints (desktop <-> device control channel) ---

// Which requests to pause and at which phase(s). Pushed desktop -> device as a snapshot like RuleSet:
// each push replaces the device's set entirely (idempotent), versioned by [epoch] with a
// BreakpointRulesAck so a lost push self-repairs (anti-entropy). Unlike Map Local — which is automated
// — a breakpoint is human-in-the-loop: on a match the device holds the in-flight request/response and
// waits for a desktop decision, so there is no per-request cache/body-fetch, only the hold + reply.
message BreakpointRules {
  repeated BreakpointRule rules = 1;
  uint64 epoch = 2;
}

// How to *match* a request, plus which phase(s) to break on. The device pauses before sending the
// request when [on_request] and before delivering the response when [on_response]; a rule with neither
// set never fires.
message BreakpointRule {
  string id = 1;
  bool enabled = 2;
  // Wildcard match against the full request URL; `*` matches any run of characters (like MapLocalRule).
  string url_pattern = 3;
  // HTTP methods this rule applies to; empty means any method.
  repeated string methods = 4;
  // Pause before the request is sent to the network.
  bool on_request = 5;
  // Pause before the response is delivered to the app.
  bool on_response = 6;
}

// device -> desktop: confirms the device applied the snapshot at [epoch], mirroring RuleAck.
message BreakpointRulesAck {
  uint64 epoch = 1;
}

// Which side of an exchange a breakpoint paused on.
enum BreakpointPhase {
  BREAKPOINT_PHASE_REQUEST = 0;
  BREAKPOINT_PHASE_RESPONSE = 1;
}

// What the desktop decided for a paused exchange. PROCEED is 0 so a malformed/empty decision fails
// safe (the request continues) rather than aborting the app's call.
enum BreakpointAction {
  BREAKPOINT_ACTION_PROCEED = 0;
  BREAKPOINT_ACTION_ABORT = 1;
}

// device -> desktop: a matched exchange is paused; here is its current state. [correlation_id] pairs it
// with the BreakpointDecision the desktop sends back. [request] is always set (the request being sent,
// or the one that produced the paused response, for display); [response] is set only for the RESPONSE
// phase. The device holds the real call open until the decision arrives (or the link drops = fail-open).
message BreakpointHit {
  string correlation_id = 1;
  string rule_id = 2;
  BreakpointPhase phase = 3;
  HttpRequest request = 4;
  HttpResponse response = 5;
}

// desktop -> device: resume the paused exchange (optionally with edits) or abort it. On PROCEED for a
// REQUEST-phase hit the device sends [edited_request] (falling back to the original if unset); on
// PROCEED for a RESPONSE-phase hit it delivers [edited_response]. On ABORT the device fails the app's
// call. A decision whose [correlation_id] is unknown (already resolved by a disconnect) is ignored.
message BreakpointDecision {
  string correlation_id = 1;
  BreakpointAction action = 2;
  HttpRequest edited_request = 3;
  HttpResponse edited_response = 4;
  // Fixed latency applied by the capture endpoint before a response-phase PROCEED is delivered.
  int32 delay_ms = 5;
}

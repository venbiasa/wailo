# XcodeGen spec (source of truth; the .xcodeproj is generated and gitignored).
# Regenerate with: cd sample-kmp/iosApp && xcodegen generate
#
# This app links two things: the KMP `Shared` framework (built by Gradle/Kotlin-Native in a
# pre-build step) and the `WailoSDK` Swift package. Wailo is wired here in Swift, never in the
# shared Kotlin module.
name: WailoKmpSampleiOS
options:
  bundleIdPrefix: com.venbiasa.wailo
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
packages:
  WailoSDK:
    path: ../../sdk-ios
targets:
  WailoKmpSampleiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: WailoSDK
        product: WailoSDK
    preBuildScripts:
      - name: "Build Kotlin/Native Shared.framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :sample-kmp:shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.venbiasa.wailo.sample.kmp.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Simulator/compile-only runs stay unsigned.
        CODE_SIGNING_ALLOWED: NO
        # Where embedAndSignAppleFrameworkForXcode places Shared.framework.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"

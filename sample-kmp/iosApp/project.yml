# XcodeGen spec (source of truth; the .xcodeproj and the generated Info.plist are gitignored).
# Regenerate with: cd sample-kmp/iosApp && xcodegen generate
#
# This app links two things: the KMP `Shared` framework (built by Gradle/Kotlin-Native in a
# pre-build step) and the `WailoSDK` Swift package. Wailo is wired here in Swift, never in the
# shared Kotlin module.
name: WailoKmpSampleiOS
options:
  bundleIdPrefix: com.venbiasa.wailo
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
packages:
  WailoSDK:
    path: ../../sdk-ios
targets:
  WailoKmpSampleiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      # The debug superset: WailoSDK plus the on-device settings panel (ADR-0035) — two-finger
      # long-press the bottom half (Option-press in the Simulator) to re-point at another desktop
      # without a rebuild.
      - package: WailoSDK
        product: WailoSDKDebug
    preBuildScripts:
      - name: "Build Kotlin/Native Shared.framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :sample-kmp:shared:embedAndSignAppleFrameworkForXcode
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # A physical device reaches the desktop across the LAN, which iOS 14+ gates behind user consent.
        # Bonjour browsing is denied outright unless the service type is declared here too.
        NSLocalNetworkUsageDescription: Wailo finds the Wailo desktop app on your network and streams this app's HTTP traffic to it.
        NSBonjourServices:
          - _wailo._tcp
        # The transport is plaintext ws:// to a LAN IP. ATS exempted IP literals until iOS 17, which now
        # requires them listed explicitly; NSAllowsLocalNetworking covers the pre-17 behaviour. The three
        # entries are the RFC 1918 private ranges, so any home/office subnet is covered.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "192.168.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
            "10.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "172.16.0.0/12":
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.venbiasa.wailo.sample.kmp.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Simulator/compile-only runs stay unsigned.
        CODE_SIGNING_ALLOWED: NO
        # Where embedAndSignAppleFrameworkForXcode places Shared.framework.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
